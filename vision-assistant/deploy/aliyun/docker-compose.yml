services:
  lanjie:
    build:
      context: ../..
      dockerfile: Dockerfile
    expose:
      - "3000"
    env_file:
      - ../../.env
    environment:
      AI_PROVIDER: doubao
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - lanjie
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
